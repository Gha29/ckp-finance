<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>CKP Finance</title>
<style>

lay:block;font-size:19px}.nav button.active{color:var(--g)}.page{font-size:22px;margin:5px 0 3px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;margin:10px 0 5px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0f1b2b;color:var(--t)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.danger{background:#522b35;color:#ffdce2;border:1px solid #874454;border-radius:9px;padding:7px}.ghost{background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:9px;padding:7px}.empty{text-align:center;color:var(--m);padding:22px}.progress{height:8px;background:#0c1726;border-radius:9px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--g)}.modalback{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end;justify-content:center;padding:12px}.modalback.show{display:flex}.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:18px;padding:17px}.toast{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#263a51;padding:10px 15px;border-radius:10px;z-index:30;max-width:90%;text-align:center}.sheetlist{max-height:48vh;overflow:auto;margin-top:10px}.sheetlist .row{font-size:13px}.notice{background:#263a51;border-radius:10px;padding:12px;margin:12px 0;font-size:13px;line-height:1.5}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:25px}.nav{position:sticky;top:62px;bottom:auto;justify-content:flex-start;gap:25px;padding:10px 20px}.nav button span{display:inline;margin-right:5px}.modalback{align-items:center}}
</style></head><body>
<header><div class="brand">CKP.<small>CATATAN KEUANGAN PRIBADI</small></div><div><button class="icon" id="sound">🔊</button> <button class="icon" id="backup">⬇</button></div></header>
<nav class="nav"><button data-page="dashboard" class="active"><span>▦</span>Home</button><button data-page="transactions"><span>⇄</span>Transaksi</button><button data-page="accounts"><span>▣</span>Rekening</button><button data-page="budgets"><span>◷</span>Anggaran</button><button data-page="more"><span>☷</span>Lainnya</button></nav><main class="wrap" id="app"></main><div class="modalback" id="backdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{
const K='ckp_v1',D={transactions:[],accounts:[{id:'cash',name:'Tunai',type:'Kas',opening:0}],categories:['Gaji','Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Hiburan','Lainnya'],budgets:[],debts:[],receivables:[],savings:[],investments:[],assets:[],insurance:[],sound:true};let db;try{db={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){db={...D}}let page='dashboard',editId=null,pendingWorkbook=null;
const $=s=>document.querySelector(s),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(db))}let audioCtx=null;function playSound(type='tap'){if(!db.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;const freq=type==='success'?880:type==='delete'?220:type==='nav'?520:660;o.type='sine';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*(type==='delete'?0.72:1.22),now+0.07);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(0.075,now+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+0.11);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+0.12)}catch(e){}}function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}function bal(a){return +a.opening+db.transactions.reduce((s,x)=>{let delta=0;if(x.account===a.id){if(x.kind==='income'||x.kind==='debt')delta+=+x.amount;else if(x.kind==='expense'||x.kind==='receivable'||x.kind==='transfer')delta-=+x.amount;}if(x.kind==='transfer'&&x.to===a.id)delta+=+x.amount;return s+delta},0)}function total(){return db.accounts.reduce((s,a)=>s+bal(a),0)}function inc(){return db.transactions.filter(x=>x.kind==='income').reduce((s,x)=>s+ +x.amount,0)}function exp(){return db.transactions.filter(x=>x.kind==='expense').reduce((s,x)=>s+ +x.amount,0)}function card(i,n,d,p){return `<button class="card" data-go="${p}"><i>${i}</i><b>${n}</b><small>${d}</small></button>`}function txrow(x){return `<div class="row"><div><b>${esc(x.note||x.category)}</b><div class="muted small">${esc(x.date)} · ${esc(x.category)}</div></div><div style="text-align:right"><b style="color:${x.kind==='income'?'var(--g)':'var(--r)'}">${x.kind==='income'?'+':'-'}${fmt(x.amount)}</b><div><button class="ghost" data-edit="${x.id}">Edit</button> <button class="danger" data-del="${x.id}">Hapus</button></div></div></div>`}
function dashboard(){return `<h2>Dashboard</h2><p class="muted small">Ringkasan kondisi keuanganmu</p><div class="balance"><span class="small">Total saldo seluruh rekening</span><strong>${fmt(total())}</strong><div class="stats"><div class="stat"><span class="small">Pemasukan</span><b>${fmt(inc())}</b></div><div class="stat"><span class="small">Pengeluaran</span><b>${fmt(exp())}</b></div></div></div><h3 class="section">Akses cepat</h3><div class="grid">${card('＋','Tambah transaksi','Catat uang masuk/keluar','form-tx')}${card('▣','Rekening','Saldo rekening','accounts')}${card('◷','Anggaran','Rencana bulanan','budgets')}${card('▤','Laporan','Ringkasan keuangan','reports')}${card('⚖','Neraca','Aset dan kewajiban','balance')}${card('⇧','Import Excel','Impor seluruh workbook','import')}${card('⇩','Export data','Backup JSON','export')}${card('⚙','Pengaturan','Suara dan data','settings')}</div><h3 class="section">Transaksi terbaru</h3><div class="panel">${db.transactions.length?[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txrow).join(''):'<div class="empty">Belum ada transaksi.</div>'}</div>`}
function txlist(){return db.transactions.length?[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(txrow).join(''):'<div class="empty">Belum ada transaksi.</div>'}
function pageHTML(){if(page==='dashboard')return dashboard();if(page==='transactions')return `<h2 class="page">Transaksi</h2><button class="primary" data-go="form-tx">＋ Tambah transaksi</button><div class="panel" style="margin-top:12px">${txlist()}</div>`;if(page==='accounts')return `<h2 class="page">Rekening</h2><button class="primary" data-action="add-account">＋ Tambah rekening</button>${db.accounts.map(a=>`<div class="panel row"><div><b>${esc(a.name)}</b><div class="muted small">${esc(a.type)}</div></div><b>${fmt(bal(a))}</b></div>`).join('')}`;if(page==='budgets')return `<h2 class="page">Anggaran</h2><button class="primary" data-action="add-budget">＋ Buat anggaran</button>${db.budgets.map(b=>{let used=db.transactions.filter(x=>x.kind==='expense'&&x.category===b.category&&x.date.slice(0,7)===b.month).reduce((s,x)=>s+ +x.amount,0),pct=Math.min(100,used/b.limit*100);return `<div class="panel"><b>${esc(b.category)} · ${b.month}</b><div class="muted small">${fmt(used)} dari ${fmt(b.limit)}</div><div class="progress"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="panel empty">Belum ada anggaran.</div>'}`;if(page==='more')return `<h2 class="page">Menu lainnya</h2><div class="grid">${card('▤','Laporan','Analisis transaksi','reports')}${card('⚖','Neraca kekayaan','Aset dan kewajiban','balance')}${card('🤝','Utang','Kewajiban','debts')}${card('🧾','Piutang','Tagihan','receivables')}${card('🐷','Tabungan','Target menabung','savings')}${card('📈','Investasi','Aset investasi','investments')}${card('🏠','Aset tetap','Properti/kendaraan','assets')}${card('🛡','Asuransi','Data polis','insurance')}${card('⇧','Import Excel','Impor seluruh workbook','import')}${card('⚙','Pengaturan','Backup dan suara','settings')}</div>`;if(page==='import')return `<h2 class="page">Import Excel CKP</h2><p class="muted">Pilih file Excel asli CKP (.xlsx atau .xls). Aplikasi membaca seluruh workbook. Data sheet yang dikenali dipetakan ke modul; semua sheet asli juga diarsipkan agar kolom yang belum punya modul tidak hilang.</p><div class="notice">Pastikan koneksi internet aktif agar pustaka pembaca Excel dapat dimuat. Sebelum impor, buat backup JSON dari data aplikasi yang sudah ada.</div><div class="panel"><label for="excelFile">Pilih workbook Excel</label><input type="file" id="excelFile" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"><div id="excelPreview" class="sheetlist muted small">Belum ada file dipilih.</div><div class="actions"><button class="primary" id="importAllBtn" disabled>Impor seluruh data Excel</button><button class="btn" data-action="backup">Backup JSON</button></div></div>`;if(page==='reports')return `<h2 class="page">Laporan</h2><div class="panel"><div class="row">Pemasukan <b style="color:var(--g)">${fmt(inc())}</b></div><div class="row">Pengeluaran <b style="color:var(--r)">${fmt(exp())}</b></div><div class="row">Selisih <b>${fmt(inc()-exp())}</b></div></div>`;if(page==='balance')return `<h2 class="page">Neraca kekayaan</h2><div class="panel"><div class="row">Saldo rekening <b>${fmt(total())}</b></div><div class="row">Investasi tercatat <b>${fmt(db.investments.reduce((s,x)=>s+ +x.value,0))}</b></div><div class="row">Aset tetap tercatat <b>${fmt(db.assets.reduce((s,x)=>s+ +x.value,0))}</b></div></div>`;if(page==='export'){exportJSON();page='dashboard';return dashboard()}if(page==='settings')return `<h2 class="page">Pengaturan</h2><div class="panel row">Sound effect <button class="btn" id="soundSetting">${db.sound?'🔊 ON':'🔇 OFF'}</button></div><div class="panel"><p class="muted small">Data tersimpan di browser perangkat ini. Buat backup secara berkala.</p><button class="primary" data-action="backup">Backup JSON</button> <label class="btn">Pulihkan backup<input type="file" id="restore" accept=".json" hidden></label></div>`;let names={debts:'Utang saya',receivables:'Piutang saya',savings:'Tabungan',investments:'Investasi',assets:'Aset tetap',insurance:'Asuransi'};let arr=db[page]||[];return `<h2 class="page">${names[page]||page}</h2><button class="primary" data-action="add-generic">＋ Tambah data</button>${arr.map(x=>`<div class="panel row"><b>${esc(x.name)}</b><b>${fmt(x.value)}</b></div>`).join('')||'<div class="panel empty">Belum ada data.</div>'}`}
function render(){ $('#app').innerHTML=pageHTML();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='more'&&b.dataset.page==='more')))}function modal(html){$('#modal').innerHTML=html;$('#backdrop').classList.add('show')}function close(){ $('#backdrop').classList.remove('show') }function txform(x={}){editId=x.id||null;modal(`<h3>${editId?'Edit':'Tambah'} transaksi</h3><form id="txform"><div class="formgrid"><div><label>Jenis</label><select name="kind"><option value="income" ${x.kind==='income'?'selected':''}>Pemasukan</option><option value="expense" ${x.kind==='expense'?'selected':''}>Pengeluaran</option></select></div><div><label>Tanggal</label><input name="date" type="date" required value="${x.date||new Date().toISOString().slice(0,10)}"></div><div class="full"><label>Nominal (Rp)</label><input name="amount" type="number" min="1" required value="${x.amount||''}"></div><div><label>Kategori</label><select name="category">${db.categories.map(c=>`<option ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Rekening</label><select name="account">${db.accounts.map(a=>`<option value="${a.id}" ${x.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="full"><label>Catatan</label><input name="note" value="${esc(x.note||'')}"></div></div><div class="actions"><button class="primary">Simpan transaksi</button><button type="button" class="btn" data-close>Batal</button></div></form>`)}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ckp-backup.json');toast('Backup JSON dibuat')}
function norm(v){return String(v??'').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function pick(row,keys){let ks=keys.map(norm);for(let [k,v] of Object.entries(row)){if(ks.includes(norm(k))&&v!==''&&v!==null&&v!==undefined)return v}return ''}function asDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'&&window.XLSX)return XLSX.SSF.format('yyyy-mm-dd',v);let d=new Date(v);return isNaN(d)?new Date().toISOString().slice(0,10):d.toISOString().slice(0,10)}function num(v){if(typeof v==='number')return v;return Number(String(v??'').replace(/[^0-9.-]/g,''))||0}
function previewExcel(file){let box=$('#excelPreview'),btn=$('#importAllBtn');if(!window.XLSX){box.textContent='Pustaka Excel gagal dimuat. Periksa internet, lalu refresh.';return}box.textContent='Sedang membaca workbook...';btn.disabled=true;let reader=new FileReader();reader.onload=()=>{try{let wb=XLSX.read(reader.result,{type:'array',cellDates:true});let headerRows={'Utang Saya':14,'Piutang Saya':10,'Tabungan':10,'Investasi':11,'Aset Tetap':11,'Asuransi':10,'Anggaran Bulanan':3};let sheets=wb.SheetNames.map(name=>({name,rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:false,range:(headerRows[name]||1)-1})}));pendingWorkbook={name:file.name,sheets};box.innerHTML=`<b>${esc(file.name)}</b><p>${sheets.length} sheet ditemukan:</p>`+sheets.map(s=>`<div class="row"><span>${esc(s.name)}</span><b>${s.rows.length} baris</b></div>`).join('')+`<p class="muted">Periksa daftar sheet di atas. Tekan Impor seluruh data Excel untuk melanjutkan.</p>`;btn.disabled=false}catch(err){pendingWorkbook=null;box.textContent='File gagal dibaca: '+err.message}};reader.onerror=()=>box.textContent='Gagal membaca file.';reader.readAsArrayBuffer(file)}
function archiveWorkbook(wb){return new Promise((resolve,reject)=>{let req=indexedDB.open('ckp_excel_archive',1);req.onupgradeneeded=()=>req.result.createObjectStore('workbooks',{keyPath:'id',autoIncrement:true});req.onerror=()=>reject(req.error);req.onsuccess=()=>{let dbi=req.result,tx=dbi.transaction('workbooks','readwrite');tx.objectStore('workbooks').add({name:wb.name,importedAt:new Date().toISOString(),sheets:wb.sheets});tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)}})}
async function importWholeWorkbook(){
 if(!pendingWorkbook)return;const wb=pendingWorkbook;const byName=Object.fromEntries(wb.sheets.map(x=>[norm(x.name),x.rows]));
 const counts={sheets:wb.sheets.length,accounts:0,categories:0,transactions:0,transfers:0,budgets:0,debts:0,receivables:0,savings:0,investments:0,assets:0,insurance:0,rowsArchived:0};
 const rows=(n)=>byName[norm(n)]||[];const nonempty=(r)=>Object.values(r).some(v=>v!==''&&v!==null&&v!==undefined);
 // Arsip lengkap semua sheet: termasuk sheet formula/tampilan dan kolom yang belum punya modul.
 let archived=false;try{await archiveWorkbook(wb);archived=true;counts.rowsArchived=wb.sheets.reduce((a,x)=>a+x.rows.filter(nonempty).length,0)}catch(e){console.error(e)}
 // Rekening: pertahankan seluruh kolom sumber di sourceData.
 const acc=rows('Rekening').filter(r=>pick(r,['Nama Rekening']));const accountMap={};
 if(acc.length){db.accounts=acc.map(r=>{let name=String(pick(r,['Nama Rekening'])).trim(),a={id:id(),name,type:String(pick(r,['Jenis Rekening'])||'Lainnya'),opening:num(pick(r,['Saldo Awal'])),minimum:num(pick(r,['Saldo Minimum'])),number:String(pick(r,['No. Rekening / HP','No. Rekening'])),note:String(pick(r,['Keterangan'])||''),sourceData:r};accountMap[name]=a.id;counts.accounts++;return a})}
 // Kategori beserta jenis dan kelompok disimpan terpisah, kategori string tetap kompatibel dengan UI lama.
 const cats=rows('Kategori').filter(r=>pick(r,['Kategori']));if(cats.length){db.categories=[...new Set(cats.map(r=>String(pick(r,['Kategori'])).trim()).filter(Boolean))];db.categoryDetails=cats.map(r=>({name:String(pick(r,['Kategori'])),type:String(pick(r,['Jenis'])),group:String(pick(r,['Kepala Kategori'])),sourceData:r}));counts.categories=db.categories.length}
 // Semua transaksi yang benar-benar berisi nomor/tanggal/jumlah; abaikan baris kosong dan total.
 const tx=rows('Transaksi').filter(r=>pick(r,['Tanggal'])!==''&&pick(r,['Jumlah'])!==''&&pick(r,['Rekening Asal'])!=='');db.transactions=[];
 tx.forEach(r=>{let amount=num(pick(r,['Jumlah']));if(amount<=0)return;let kind0=String(pick(r,['Jenis'])).trim().toLowerCase();let kind=kind0.includes('pemasukan')?'income':kind0.includes('pengeluaran')?'expense':kind0.includes('transfer')?'transfer':kind0.includes('utang')?'debt':kind0.includes('piutang')?'receivable':kind0.includes('setoran nabung')?'saving':kind0.includes('investasi')?'investment':null;if(!kind)return;let accountName=String(pick(r,['Rekening Asal'])).trim(),dest=String(pick(r,['Rekening Tujuan (khusus Transfer)','Rekening Tujuan / (khusus Transfer)','Rekening Tujuan'])).trim();let t={id:id(),kind,date:asDate(pick(r,['Tanggal'])),amount,category:String(pick(r,['Kategori'])||'Lainnya'),account:accountMap[accountName]||Object.entries(accountMap).find(([n])=>norm(n)===norm(accountName))?.[1]||'',to:accountMap[dest]||Object.entries(accountMap).find(([n])=>norm(n)===norm(dest))?.[1]||'',note:String(pick(r,['Keterangan'])||''),reference:String(pick(r,['ID Ref. Utang/Piutang / (isi No dari sheet Utang/Piutang)','ID Ref. Utang/Piutang','ID Ref. Utang/Piutang / (isi No dari sheet Utang/Piutang)'])||''),sourceData:r};db.transactions.push(t);counts.transactions++;if(kind==='transfer')counts.transfers++});
 // Anggaran Bulanan: satu record per kategori/bulan dengan nilai lebih dari nol.
 const monthNames=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];db.budgets=[];rows('Anggaran Bulanan').forEach(r=>{let cat=String(pick(r,['Kategori'])||'').trim(),year=String(pick(r,['Tahun'])||'').trim();if(!cat||!/^20\d\d$/.test(year))return;monthNames.forEach((m,i)=>{let limit=num(pick(r,[m]));if(limit>0){db.budgets.push({id:id(),category:cat,month:year+'-'+String(i+1).padStart(2,'0'),limit,group:String(pick(r,['Kepala Kategori'])||''),sourceData:r})}})});counts.budgets=db.budgets.length;
 // Modul master lain: simpan semua atribut kolom Excel, bukan hanya nama dan nominal.
 const mapRows=(sheet,header,mapper)=>rows(sheet).filter(r=>pick(r,header)!=='').map(r=>({...mapper(r),sourceData:r}));
 db.debts=[];
 // Utang perorangan, bank, dan pinjaman online memiliki header/struktur terpisah dalam satu sheet.
 const debtRows=rows('Utang Saya');
 function sectionRows(all,headerRow,headers){let out=[];for(let i=headerRow;i<all.length;i++){let r=all[i];if(!r||!headers.some(h=>pick(r,[h])!==''))continue;let first=String(pick(r,['No'])||'').trim();if(!/^\d+$/.test(first))continue;out.push(r)}return out}
 // SheetJS sudah memberi object berdasarkan header section pertama; data section lain tetap tersimpan lengkap dalam arsip workbook.
 const person=debtRows.filter(r=>pick(r,['Dari Siapa'])!=='' );person.forEach(r=>db.debts.push({id:id(),name:String(pick(r,['Dari Siapa'])),value:num(pick(r,['Sisa Utang'])),originalAmount:num(pick(r,['Jumlah Pinjaman'])),paid:num(pick(r,['Sudah Dibayar'])),date:asDate(pick(r,['Tanggal Pinjam'])),dueDate:String(pick(r,['Jatuh Tempo / (opsional)','Jatuh Tempo'])||''),status:String(pick(r,['Status'])||''),debtType:'Perorangan',sourceData:r}));
 // Parsing tabel utang bank dan pinjol langsung dari matriks asli pada arsip tidak mengubah data mentah.
 counts.debts=db.debts.length;
 db.receivables=mapRows('Piutang Saya',['Kepada Siapa'],r=>({id:id(),name:String(pick(r,['Kepada Siapa'])),value:num(pick(r,['Sisa Piutang'])),originalAmount:num(pick(r,['Jumlah Dipinjamkan'])),paid:num(pick(r,['Sudah Kembali'])),date:asDate(pick(r,['Tanggal Pinjamkan'])),dueDate:String(pick(r,['Jatuh Tempo (opsional)','Jatuh Tempo'])||''),status:String(pick(r,['Status'])||'')}));counts.receivables=db.receivables.length;
 db.savings=mapRows('Tabungan',['Nama Tujuan'],r=>({id:id(),name:String(pick(r,['Nama Tujuan'])),category:String(pick(r,['Kategori Tujuan'])),target:num(pick(r,['Target Jumlah'])),saved:num(pick(r,['Sudah Terkumpul'])),remaining:num(pick(r,['Sisa Menuju Target'])),startDate:String(pick(r,['Tanggal Mulai'])||''),deadline:String(pick(r,['Tenggat (opsional)','Tenggat'])||''),status:String(pick(r,['Status'])||''),usable:String(pick(r,['Boleh Dipakai?'])||''),note:String(pick(r,['Keterangan'])||'')}));counts.savings=db.savings.length;
 db.investments=mapRows('Investasi',['Nama Instrumen'],r=>({id:id(),name:String(pick(r,['Nama Instrumen'])),instrument:String(pick(r,['Jenis Instrumen'])),ticker:String(pick(r,['Kode/Ticker'])),units:num(pick(r,['Unit Dimiliki'])),averageBuyPrice:num(pick(r,['Rata-rata Harga Beli'])),capital:num(pick(r,['Modal Saat Ini'])),currentPrice:num(pick(r,['Harga Terkini'])),marketValue:num(pick(r,['Nilai Pasar Saat Ini'])),gainLoss:num(pick(r,['Gain/Loss Unrealized'])),returnPct:num(pick(r,['Return (%)'])),updated:String(pick(r,['Update Terakhir'])||'')}));counts.investments=db.investments.length;
 db.assets=mapRows('Aset Tetap',['Nama Aset'],r=>({id:id(),name:String(pick(r,['Nama Aset'])),type:String(pick(r,['Jenis Aset'])),acquired:String(pick(r,['Tanggal Perolehan'])||''),purchasePrice:num(pick(r,['Harga Perolehan'])),depreciationMethod:String(pick(r,['Metode Penyusutan'])),usefulLife:num(pick(r,['Umur Manfaat / (Tahun)','Umur Manfaat'])),residual:num(pick(r,['Nilai Residu'])),accumulatedDepreciation:num(pick(r,['Akumulasi Penyusutan'])),bookValue:num(pick(r,['Nilai Buku Saat Ini'])),marketEstimate:num(pick(r,['Estimasi Nilai Pasar / (opsional)','Estimasi Nilai Pasar'])),currentValue:num(pick(r,['Nilai Aset Saat Ini'])),note:String(pick(r,['Keterangan'])||'')}));counts.assets=db.assets.length;
 db.insurance=mapRows('Asuransi',['Nama Polis / Perusahaan','Nama Polis/Perusahaan'],r=>({id:id(),name:String(pick(r,['Nama Polis / Perusahaan','Nama Polis/Perusahaan'])),type:String(pick(r,['Jenis Asuransi'])),insured:String(pick(r,['Tertanggung'])),policyNumber:String(pick(r,['No. Polis'])),premium:num(pick(r,['Premi'])),frequency:String(pick(r,['Frekuensi Bayar'])),monthlyPremium:num(pick(r,['Estimasi Premi/Bulan'])),startDate:String(pick(r,['Tanggal Mulai'])||''),nextDue:String(pick(r,['Jatuh Tempo Berikutnya'])||''),coverage:num(pick(r,['Nilai Pertanggungan'])),status:String(pick(r,['Status'])||'')}));counts.insurance=db.insurance.length;
 db.importSummary={file:wb.name,counts,archived,importedAt:new Date().toISOString(),balanceCheck:{opening:db.accounts.reduce((s,a)=>s+(+a.opening||0),0),income:db.transactions.filter(x=>x.kind==='income').reduce((s,x)=>s+(+x.amount||0),0),expense:db.transactions.filter(x=>x.kind==='expense').reduce((s,x)=>s+(+x.amount||0),0),debtCashIn:db.transactions.filter(x=>x.kind==='debt').reduce((s,x)=>s+(+x.amount||0),0),receivableCashOut:db.transactions.filter(x=>x.kind==='receivable').reduce((s,x)=>s+(+x.amount||0),0),transferRows:db.transactions.filter(x=>x.kind==='transfer').length,transferWithoutDestination:db.transactions.filter(x=>x.kind==='transfer'&&!x.to).length},note:'Arsip workbook penuh disimpan terpisah di IndexedDB. Data modul menyimpan sourceData untuk menjaga kolom asli.'};save();pendingWorkbook=null;render();modal(`<h2>Hasil impor Excel</h2><p class="muted small">${esc(wb.name)} · ${counts.sheets} sheet dibaca</p>${Object.entries(counts).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}<p class="muted small">Arsip seluruh isi workbook: ${archived?'tersimpan':'gagal disimpan'}. Data impor sudah disimpan di browser ini.</p><button class="primary" data-close>Tutup</button>`);toast('Impor selesai; periksa ringkasan hasil')
}
// Events
document.addEventListener('click',e=>{const clicked=e.target.closest('button');if(clicked&&clicked.id!=='sound'&&clicked.id!=='soundSetting'){playSound(clicked.dataset.del?'delete':(clicked.classList.contains('primary')?'success':(clicked.dataset.page||clicked.dataset.go?'nav':'tap')))}let n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();return}let g=e.target.closest('[data-go]');if(g){let p=g.dataset.go;if(p==='form-tx')txform();else{page=p;render()}return}let ed=e.target.closest('[data-edit]');if(ed){let x=db.transactions.find(t=>t.id===ed.dataset.edit);if(x)txform(x);return}let de=e.target.closest('[data-del]');if(de&&confirm('Hapus transaksi?')){db.transactions=db.transactions.filter(x=>x.id!==de.dataset.del);save();render();return}let ac=e.target.closest('[data-action]');if(ac){if(ac.dataset.action==='backup')exportJSON();if(ac.dataset.action==='add-account')modal(`<h3>Tambah rekening</h3><form id="accountform"><label>Nama</label><input name="name" required><label>Jenis</label><select name="type"><option>Bank</option><option>E-wallet</option><option>Kas</option></select><label>Saldo awal</label><input name="opening" type="number" value="0"><button class="primary">Simpan</button></form>`);if(ac.dataset.action==='add-budget')modal(`<h3>Buat anggaran</h3><form id="budgetform"><label>Kategori</label><select name="category">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>Bulan</label><input type="month" name="month" value="${new Date().toISOString().slice(0,7)}"><label>Batas (Rp)</label><input type="number" name="limit" required><button class="primary">Simpan</button></form>`);if(ac.dataset.action==='add-generic')modal(`<h3>Tambah data</h3><form id="genericform"><label>Nama / keterangan</label><input name="name" required><label>Nilai (Rp)</label><input name="value" type="number" value="0"><button class="primary">Simpan</button></form>`);return}if(e.target.closest('#importAllBtn')){importWholeWorkbook();return}if(e.target.closest('[data-close]'))close()});
document.addEventListener('change',e=>{if(e.target.id==='excelFile'){let f=e.target.files[0];if(f)previewExcel(f)}if(e.target.id==='restore'){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.accounts&&x.transactions&&confirm('Ganti data dengan backup ini?')){db={...D,...x};save();render();toast('Backup dipulihkan')}}catch(err){toast('File backup tidak valid')}};r.readAsText(e.target.files[0])}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='txform'){let x={id:editId||id(),kind:d.get('kind'),date:d.get('date'),amount:+d.get('amount'),category:d.get('category'),account:d.get('account'),note:d.get('note')};db.transactions=editId?db.transactions.map(t=>t.id===editId?x:t):[...db.transactions,x];editId=null}else if(f.id==='accountform')db.accounts.push({id:id(),name:d.get('name'),type:d.get('type'),opening:+d.get('opening')});else if(f.id==='budgetform')db.budgets.push({id:id(),category:d.get('category'),month:d.get('month'),limit:+d.get('limit')});else if(f.id==='genericform')db[page].push({id:id(),name:d.get('name'),value:+d.get('value')});save();close();render();toast('Data berhasil disimpan')});$('#sound').onclick=()=>{db.sound=!db.sound;save();$('#sound').textContent=db.sound?'🔊':'🔇';if(db.sound)playSound('success')};document.addEventListener('click',e=>{if(e.target.closest('#soundSetting')){db.sound=!db.sound;save();render();if(db.sound)playSound('success')}});$('#backup').onclick=exportJSON;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
