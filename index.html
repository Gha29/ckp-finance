<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>CKP Finance</title><style>
:root{--bg:#0d1523;--p:#172338;--p2:#1d2b40;--line:#2b3b52;--t:#eef4fb;--m:#9aabc0;--g:#42d392;--r:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#111d2eef;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{font-size:23px;font-weight:850;color:var(--g)}.brand small{display:block;font-size:10px;color:var(--m);letter-spacing:1px}.btn,.icon{background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.primary{background:var(--g);color:#062519;border:0;border-radius:10px;padding:10px 14px;font-weight:750}.wrap{max-width:1050px;margin:auto;padding:18px 14px 100px}.muted{color:var(--m)}.small{font-size:12px}.balance{background:linear-gradient(125deg,#126342,#174a57);border:1px solid #278365;border-radius:20px;padding:21px;margin:18px 0}.balance strong{display:block;font-size:30px;margin:8px 0 14px}.stats,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#ffffff12;padding:10px;border-radius:12px}.stat b{display:block;margin-top:5px}.section{margin:23px 0 12px;font-size:17px}.card,.panel{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:15px}.card{text-align:left;color:var(--t);min-height:100px}.card:active{border-color:var(--g);transform:scale(.98)}.card i{font-size:23px;font-style:normal}.card b{display:block;margin-top:8px}.card small{color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#111d2ef5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:6}.nav button{border:0;background:none;color:var(--m);font-size:10px}.nav button span{display:block;font-size:19px}.nav button.active{color:var(--g)}.page{font-size:22px;margin:5px 0 3px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;margin:10px 0 5px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0f1b2b;color:var(--t)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.danger{background:#522b35;color:#ffdce2;border:1px solid #874454;border-radius:9px;padding:7px}.ghost{background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:9px;padding:7px}.empty{text-align:center;color:var(--m);padding:22px}.progress{height:8px;background:#0c1726;border-radius:9px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--g)}.modalback{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end;justify-content:center;padding:12px}.modalback.show{display:flex}.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:18px;padding:17px}.toast{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#263a51;padding:10px 15px;border-radius:10px;z-index:30}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:25px}.nav{position:sticky;top:62px;bottom:auto;justify-content:flex-start;gap:25px;padding:10px 20px}.nav button span{display:inline;margin-right:5px}.modalback{align-items:center}}
</style></head><body><header><div class="brand">CKP.<small>CATATAN KEUANGAN PRIBADI</small></div><div><button class="icon" id="sound">🔊</button> <button class="icon" id="backup">⬇</button></div></header><nav class="nav"><button data-page="dashboard" class="active"><span>▦</span>Home</button><button data-page="transactions"><span>⇄</span>Transaksi</button><button data-page="accounts"><span>▣</span>Rekening</button><button data-page="budgets"><span>◷</span>Anggaran</button><button data-page="more"><span>☷</span>Lainnya</button></nav><main class="wrap" id="app"></main><div class="modalback" id="backdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{const K='ckp_v1',D={transactions:[],accounts:[{id:'cash',name:'Tunai',type:'Kas',opening:0}],categories:['Gaji','Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Hiburan','Lainnya'],budgets:[],debts:[],receivables:[],savings:[],investments:[],assets:[],insurance:[],sound:true};let db;try{db={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){db={...D}}let page='dashboard',editId=null;const $=s=>document.querySelector(s),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(db))}function sound(type='click'){if(!db.sound)return;try{let C=AudioContext||webkitAudioContext,c=sound.ctx||(sound.ctx=new C),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=type==='open'?780:600;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.12)}catch(e){}}function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}function bal(a){return +a.opening+db.transactions.reduce((s,x)=>s+(x.account===a.id?(x.kind==='income'?+x.amount:x.kind==='expense'?-x.amount:0):0),0)}function total(){return db.accounts.reduce((s,a)=>s+bal(a),0)}function inc(){return db.transactions.filter(x=>x.kind==='income').reduce((s,x)=>s+ +x.amount,0)}function exp(){return db.transactions.filter(x=>x.kind==='expense').reduce((s,x)=>s+ +x.amount,0)}function go(p){sound('open');page=p;render()}function card(i,n,d,p){return `<button class="card" data-go="${p}"><i>${i}</i><b>${n}</b><small>${d}</small></button>`}function txrow(x){return `<div class="row"><div><b>${esc(x.note||x.category)}</b><div class="muted small">${esc(x.date)} · ${esc(x.category)}</div></div><div style="text-align:right"><b style="color:${x.kind==='income'?'var(--g)':'var(--r)'}">${x.kind==='income'?'+':'-'}${fmt(x.amount)}</b><div><button class="ghost" data-edit="${x.id}">Edit</button> <button class="danger" data-del="${x.id}">Hapus</button></div></div></div>`}function dashboard(){return `<h2>Dashboard</h2><p class="muted small">Ringkasan kondisi keuanganmu</p><div class="balance"><span class="small">Total saldo seluruh rekening</span><strong>${fmt(total())}</strong><div class="stats"><div class="stat"><span class="small">Pemasukan</span><b>${fmt(inc())}</b></div><div class="stat"><span class="small">Pengeluaran</span><b>${fmt(exp())}</b></div></div></div><h3 class="section">Akses cepat</h3><div class="grid">${card('＋','Tambah transaksi','Catat uang masuk/keluar','form-tx')}${card('▣','Rekening','Saldo rekening','accounts')}${card('◷','Anggaran','Rencana bulanan','budgets')}${card('▤','Laporan','Ringkasan keuangan','reports')}${card('⚖','Neraca','Aset dan kewajiban','balance')}${card('⇧','Import CSV','Impor transaksi','import')}${card('⇩','Export data','Backup JSON','export')}${card('⚙','Pengaturan','Suara dan data','settings')}</div><h3 class="section">Transaksi terbaru</h3><div class="panel">${db.transactions.length?[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txrow).join(''):'<div class="empty">Belum ada transaksi.</div>'}</div>`}function txlist(){return db.transactions.length?[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(txrow).join(''):'<div class="empty">Belum ada transaksi.</div>'}function pageHTML(){if(page==='dashboard')return dashboard();if(page==='transactions')return `<h2 class="page">Transaksi</h2><button class="primary" data-go="form-tx">＋ Tambah transaksi</button><div class="panel" style="margin-top:12px">${txlist()}</div>`;if(page==='accounts')return `<h2 class="page">Rekening</h2><button class="primary" data-action="add-account">＋ Tambah rekening</button>${db.accounts.map(a=>`<div class="panel row"><div><b>${esc(a.name)}</b><div class="muted small">${esc(a.type)}</div></div><b>${fmt(bal(a))}</b></div>`).join('')}`;if(page==='budgets')return `<h2 class="page">Anggaran</h2><button class="primary" data-action="add-budget">＋ Buat anggaran</button>${db.budgets.map(b=>{let used=db.transactions.filter(x=>x.kind==='expense'&&x.category===b.category&&x.date.slice(0,7)===b.month).reduce((s,x)=>s+ +x.amount,0),pct=Math.min(100,used/b.limit*100);return `<div class="panel"><b>${esc(b.category)} · ${b.month}</b><div class="muted small">${fmt(used)} dari ${fmt(b.limit)}</div><div class="progress"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="panel empty">Belum ada anggaran.</div>'}`;if(page==='more')return `<h2 class="page">Menu lainnya</h2><div class="grid">${card('▤','Laporan','Analisis transaksi','reports')}${card('⚖','Neraca kekayaan','Aset dan kewajiban','balance')}${card('🤝','Utang','Kewajiban','debts')}${card('🧾','Piutang','Tagihan','receivables')}${card('🐷','Tabungan','Target menabung','savings')}${card('📈','Investasi','Aset investasi','investments')}${card('🏠','Aset tetap','Properti/kendaraan','assets')}${card('🛡','Asuransi','Data polis','insurance')}${card('⇧','Import CSV','Masukkan transaksi','import')}${card('⚙','Pengaturan','Backup dan suara','settings')}</div>`;if(page==='reports')return `<h2 class="page">Laporan</h2><div class="panel"><div class="row">Pemasukan <b style="color:var(--g)">${fmt(inc())}</b></div><div class="row">Pengeluaran <b style="color:var(--r)">${fmt(exp())}</b></div><div class="row">Selisih <b>${fmt(inc()-exp())}</b></div></div>`;if(page==='balance')return `<h2 class="page">Neraca kekayaan</h2><div class="panel"><div class="row">Saldo rekening <b>${fmt(total())}</b></div><div class="row">Investasi tercatat <b>${fmt(db.investments.reduce((s,x)=>s+ +x.value,0))}</b></div><div class="row">Aset tetap tercatat <b>${fmt(db.assets.reduce((s,x)=>s+ +x.value,0))}</b></div><p class="muted small">Ringkasan awal, belum merupakan neraca akuntansi berpasangan.</p></div>`;if(page==='import')return `<h2 class="page">Import CSV</h2><div class="notice">CSV harus memiliki kolom: tanggal,jenis,nominal,kategori,rekening,catatan. Jenis: income atau expense.</div><div class="panel"><input type="file" id="csv" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>`;if(page==='export'){setTimeout(exportJSON,50);page='dashboard';return dashboard()}if(page==='settings')return `<h2 class="page">Pengaturan</h2><div class="panel row">Sound effect <button class="btn" id="soundSetting">${db.sound?'🔊 ON':'🔇 OFF'}</button></div><div class="panel"><p class="muted small">Data tersimpan di browser perangkat ini. Buat backup secara berkala.</p><button class="primary" data-action="backup">Backup JSON</button> <label class="btn">Pulihkan backup<input type="file" id="restore" accept=".json" hidden></label></div>`;let names={debts:'Utang saya',receivables:'Piutang saya',savings:'Tabungan',investments:'Investasi',assets:'Aset tetap',insurance:'Asuransi'};let arr=db[page]||[];return `<h2 class="page">${names[page]||page}</h2><button class="primary" data-action="add-generic">＋ Tambah data</button>${arr.map(x=>`<div class="panel row"><b>${esc(x.name)}</b><b>${fmt(x.value)}</b></div>`).join('')||'<div class="panel empty">Belum ada data.</div>'}`}function render(){ $('#app').innerHTML=pageHTML();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='more'&&b.dataset.page==='more')))}function modal(html){$('#modal').innerHTML=html;$('#backdrop').classList.add('show');sound('open')}function close(){ $('#backdrop').classList.remove('show') }function txform(x={}){editId=x.id||null;modal(`<h3>${editId?'Edit':'Tambah'} transaksi</h3><form id="txform"><div class="formgrid"><div><label>Jenis</label><select name="kind"><option value="income" ${x.kind==='income'?'selected':''}>Pemasukan</option><option value="expense" ${x.kind==='expense'?'selected':''}>Pengeluaran</option></select></div><div><label>Tanggal</label><input name="date" type="date" required value="${x.date||new Date().toISOString().slice(0,10)}"></div><div class="full"><label>Nominal (Rp)</label><input name="amount" type="number" min="1" required value="${x.amount||''}"></div><div><label>Kategori</label><select name="category">${db.categories.map(c=>`<option ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Rekening</label><select name="account">${db.accounts.map(a=>`<option value="${a.id}" ${x.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="full"><label>Catatan</label><input name="note" value="${esc(x.note||'')}"></div></div><div class="actions"><button class="primary">Simpan transaksi</button><button type="button" class="btn" data-close>Batal</button></div></form>`)}function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'ckp-backup.json');toast('Backup dibuat')}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCSV(){let rows=[['tanggal','jenis','nominal','kategori','rekening','catatan'],...db.transactions.map(x=>[x.date,x.kind,x.amount,x.category,db.accounts.find(a=>a.id===x.account)?.name||'',x.note])];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'}),'ckp-transaksi.csv')}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){go(n.dataset.page);return}let g=e.target.closest('[data-go]');if(g){let p=g.dataset.go;if(p==='form-tx')txform();else go(p);return}let ed=e.target.closest('[data-edit]');if(ed){let x=db.transactions.find(t=>t.id===ed.dataset.edit);if(x)txform(x);return}let de=e.target.closest('[data-del]');if(de&&confirm('Hapus transaksi?')){db.transactions=db.transactions.filter(x=>x.id!==de.dataset.del);save();render();toast('Transaksi dihapus');return}let ac=e.target.closest('[data-action]');if(ac){if(ac.dataset.action==='backup')exportJSON();if(ac.dataset.action==='add-account')modal(`<h3>Tambah rekening</h3><form id="accountform"><label>Nama</label><input name="name" required><label>Jenis</label><select name="type"><option>Bank</option><option>E-wallet</option><option>Kas</option></select><label>Saldo awal</label><input name="opening" type="number" value="0"><div class="actions"><button class="primary">Simpan</button></div></form>`);if(ac.dataset.action==='add-budget')modal(`<h3>Buat anggaran</h3><form id="budgetform"><label>Kategori</label><select name="category">${db.categories.map(c=>`<option>${c}</option>`).join('')}</select><label>Bulan</label><input type="month" name="month" value="${new Date().toISOString().slice(0,7)}"><label>Batas (Rp)</label><input type="number" name="limit" required><div class="actions"><button class="primary">Simpan</button></div></form>`);if(ac.dataset.action==='add-generic')modal(`<h3>Tambah data</h3><form id="genericform"><label>Nama / keterangan</label><input name="name" required><label>Nilai (Rp)</label><input name="value" type="number" value="0"><div class="actions"><button class="primary">Simpan</button></div></form>`);return}if(e.target.closest('[data-close]'))close()});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='txform'){let x={id:editId||id(),kind:d.get('kind'),date:d.get('date'),amount:+d.get('amount'),category:d.get('category'),account:d.get('account'),note:d.get('note')};db.transactions=editId?db.transactions.map(t=>t.id===editId?x:t):[...db.transactions,x];editId=null}else if(f.id==='accountform')db.accounts.push({id:id(),name:d.get('name'),type:d.get('type'),opening:+d.get('opening')});else if(f.id==='budgetform')db.budgets.push({id:id(),category:d.get('category'),month:d.get('month'),limit:+d.get('limit')});else if(f.id==='genericform')db[page].push({id:id(),name:d.get('name'),value:+d.get('value')});save();close();render();toast('Data berhasil disimpan');sound('save')});$('#sound').onclick=()=>{db.sound=!db.sound;save();$('#sound').textContent=db.sound?'🔊':'🔇';if(db.sound)sound('save')};$('#backup').onclick=exportJSON;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};let pendingWorkbook=null;
function norm(v){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')}
function pick(row,keys){let ks=keys.map(norm);for(let [k,v] of Object.entries(row)){if(ks.includes(norm(k))&&v!==''&&v!==null&&v!==undefined)return v}return ''}
function asDate(v){if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number'&&window.XLSX)return XLSX.SSF.format('yyyy-mm-dd',v);let d=new Date(v);return isNaN(d)?new Date().toISOString().slice(0,10):d.toISOString().slice(0,10)}
function previewExcel(file){let box=document.getElementById('excelPreview'),btn=document.getElementById('importAllBtn');box.textContent='Membaca workbook...';btn.disabled=true;if(!window.XLSX){box.textContent='Library pembaca Excel gagal dimuat. Pastikan internet aktif, lalu muat ulang halaman.';return}let r=new FileReader();r.onload=()=>{try{let wb=XLSX.read(r.result,{type:'array',cellDates:true});let headerRows={'Utang Saya':14,'Piutang Saya':10,'Tabungan':10,'Investasi':11,'Aset Tetap':11,'Asuransi':10,'Anggaran Bulanan':3};let sheets=wb.SheetNames.map(n=>{let rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false,range:(headerRows[n]||1)-1});return {name:n,rows}});pendingWorkbook={name:file.name,sheets};let summary=sheets.map(x=>`<div class="row" style="padding:5px 0"><span>${esc(x.name)}</span><b>${x.rows.length} baris</b></div>`).join('');box.innerHTML=`<b>${esc(file.name)}</b><p class="muted small">${sheets.length} sheet ditemukan</p>${summary}<p class="muted small" style="margin-top:10px">CKP akan menyimpan arsip seluruh sheet dan mengimpor baris yang sesuai format.</p>`;btn.disabled=false}catch(err){pendingWorkbook=null;box.textContent='File Excel tidak dapat dibaca. Pastikan file tidak rusak atau terkunci.'}};r.onerror=()=>box.textContent='Gagal membaca file.';r.readAsArrayBuffer(file)}
function importWholeWorkbook(){if(!pendingWorkbook)return;let wb=pendingWorkbook;let byName=Object.fromEntries(wb.sheets.map(s=>[norm(s.name),s.rows]));let imported={accounts:0,categories:0,transactions:0,budgets:0,debts:0,receivables:0,savings:0,investments:0,assets:0,insurance:0};
const get=(sheet,keys)=> (byName[norm(sheet)]||[]).filter(r=>pick(r,keys)!=='');
let accRows=get('Rekening',['Nama Rekening']);let accountMap={};if(accRows.length){db.accounts=[];accRows.forEach(r=>{let name=String(pick(r,['Nama Rekening'])).trim();if(!name)return;let a={id:id(),name,type:String(pick(r,['Jenis Rekening'])||'Lainnya'),opening:Number(pick(r,['Saldo Awal'])||0)};db.accounts.push(a);accountMap[name]=a.id;imported.accounts++})}
let catRows=get('Kategori',['Kategori']);if(catRows.length){db.categories=[...new Set(catRows.map(r=>String(pick(r,['Kategori'])).trim()).filter(Boolean))];imported.categories=db.categories.length}
let txRows=get('Transaksi',['Tanggal']);if(txRows.length){db.transactions=[];txRows.forEach(r=>{let kind=String(pick(r,['Jenis']));let amount=Number(String(pick(r,['Jumlah'])).replace(/[^0-9.-]/g,''));let accountName=String(pick(r,['Rekening Asal']));if(!amount||!accountName)return;let k=kind==='Pemasukan'?'income':kind==='Pengeluaran'?'expense':kind==='Transfer'?'transfer':kind==='Utang'?'income':kind==='Piutang'?'expense':null;if(!k)return;let dest=String(pick(r,['Rekening Tujuan (khusus Transfer)','Rekening Tujuan']));db.transactions.push({id:id(),kind:k,date:asDate(pick(r,['Tanggal'])),amount,category:String(pick(r,['Kategori'])||'Lainnya'),account:accountMap[accountName]||db.accounts[0]?.id||'cash',to:accountMap[dest]||'',note:String(pick(r,['Keterangan'])||'')});imported.transactions++})}
let bRows=get('Anggaran Bulanan',['Kategori']);if(bRows.length){db.budgets=[];let months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];bRows.forEach(r=>{let cat=String(pick(r,['Kategori']));if(!cat||/^tahun |^kebutuhan|^transportasi|^gaya hidup|^pendapatan|^kesehatan|^kewajiban/i.test(cat))return;months.forEach(m=>{let val=Number(r[m]||0);if(val>0)db.budgets.push({id:id(),category:cat,month:String(pick(r,['Tahun'])||new Date().getFullYear())+'-'+String(months.indexOf(m)+1).padStart(2,'0'),limit:val})})});imported.budgets=db.budgets.length}
const configs=[['Utang Saya','debts',['Dari Siapa'],['Sisa Utang','Jumlah Pinjaman']],['Piutang Saya','receivables',['Kepada Siapa'],['Sisa Piutang','Jumlah Dipinjamkan']],['Tabungan','savings',['Nama Tujuan'],['Target Jumlah']],['Investasi','investments',['Nama Instrumen'],['Nilai Pasar Saat Ini','Modal Saat Ini']],['Aset Tetap','assets',['Nama Aset'],['Valor','Nilai Aset Saat Ini','Nilai Buku Saat Ini']],['Asuransi','insurance',['Nama Polis / Perusahaan'],['Valor','Nilai Pertanggungan']]];
configs.forEach(([sheet,key,nameKeys,valKeys])=>{let rows=get(sheet,nameKeys);if(!rows.length)return;db[key]=[];rows.forEach(r=>{let name=pick(r,nameKeys);if(!name)return;let val=pick(r,valKeys);db[key].push({id:id(),name:String(name),value:Number(String(val||0).replace(/[^0-9.-]/g,''))||0,note:String(pick(r,['Keterangan','Status'])||''),date:asDate(pick(r,['Tanggal Pinjam','Tanggal Pinjamkan','Tanggal Perolehan']))})});imported[key]=db[key].length});
db.importedWorkbook={name:wb.name,importedAt:new Date().toISOString(),sheets:wb.sheets.map(s=>({name:s.name,rows:s.rows}))};save();pendingWorkbook=null;toast('Impor selesai. '+imported.transactions+' transaksi dimuat.');page='dashboard';render();renderSpecial();openModal(`<h2>Impor Excel selesai</h2><p class="muted small">File: ${esc(wb.name)}</p>${Object.entries(imported).map(([k,v])=>`<div class="row" style="padding:5px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}<p class="muted small" style="margin-top:12px">Seluruh sheet asli juga disimpan sebagai arsip lokal pada perangkat ini. Segera buat backup JSON.</p><button class="primary" style="margin-top:14px" data-close>Tutup</button>`)}
document.addEventListener('change',e=>{if(e.target.id==='csv'){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let rows;if(/\.xlsx?$/i.test(file.name)){if(!window.XLSX){toast('Library Excel belum termuat. Periksa koneksi internet lalu coba lagi.');return}let book=XLSX.read(r.result,{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:''})}else{let lines=String(r.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),headers=lines.shift().split(',').map(x=>x.replace(/"/g,'').trim());rows=lines.map(line=>{let vals=line.split(',').map(x=>x.replace(/^"|"$/g,'')),o={};headers.forEach((h,i)=>o[h]=vals[i]||'');return o})}let count=0;rows.forEach(row=>{let obj={};Object.keys(row).forEach(k=>obj[String(k).trim().toLowerCase()]=row[k]);let kind=String(obj.jenis||'').toLowerCase().trim(),amount=Number(String(obj.nominal||'').replace(/[^0-9.-]/g,''));if(!['income','expense'].includes(kind)||!amount)return;let acc=db.accounts.find(x=>x.name===String(obj.rekening||''))||db.accounts[0];let rawDate=obj.tanggal;let date=rawDate instanceof Date?rawDate.toISOString().slice(0,10):String(rawDate||new Date().toISOString().slice(0,10)).slice(0,10);db.transactions.push({id:id(),date,kind,amount,category:String(obj.kategori||'Lainnya'),account:acc.id,note:String(obj.catatan||'')});count++});save();go('transactions');toast(count+' transaksi diimpor')}catch(err){toast('Gagal membaca file. Periksa format kolom.')}};if(/\.xlsx?$/i.test(file.name))r.readAsArrayBuffer(file);else r.readAsText(file)}if(e.target.id==='restore'){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.accounts&&x.transactions&&confirm('Ganti data dengan backup ini?')){db={...D,...x};save();render();toast('Backup dipulihkan')}}catch(e){toast('File tidak valid')}};r.readAsText(e.target.files[0])}if(e.target.id==='soundSetting'){}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
